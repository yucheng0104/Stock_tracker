{% extends 'base.html' %}

{% block title %}註冊{% endblock %}

{% block content%}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h1 class="mb-4">註冊</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">註冊</button>
        </form>
        <p class="mt-3 text-center">已有帳號？<a href="{% url 'login' %}">登入</a></p>

    </div>
</div>
{% endblock%}
