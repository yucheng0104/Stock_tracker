<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}股票觀察清單{% endblock %}</title>
</head>
<body>
    <nav>
        {% if user.is_authenticated %}
            <span>你好，{{ user.username }}！</span>
            <a href="{% url 'stock_list' %}">股票清單</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">登出</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">登入</a>
            <a href="{% url 'register' %}">註冊</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
