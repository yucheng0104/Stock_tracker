<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}股票觀察清單{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'stock_list' %}">股票觀察清單</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
            <span class="text-white">你好，{{ user.username }}！</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">登出</button>
            </form>
            {% else %}
            <a href="{% url 'login' %} " class="btn btn-light btn-sm">登入</a>
            <a href="{% url 'register' %}" class="btn btn-light btn-sm">註冊</a>
            {% endif %}
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
