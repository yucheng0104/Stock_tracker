<!DOCTYPE html>
<html>
<head>
    <title>股票觀察清單</title>
</head>
<body>
    <h1>我的股票清單</h1>

    {% if user.is_authenticated %}
        <p>你好，{{ user.username }}！</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">登出</button>
    {% else %}
        <a href="{% url 'login' %}">登入</a>
    {% endif %}

    {% if stocks %}
        <ul>
            {% for stock in stocks %}
                <li>{{ stock.symbol }} - {{ stock.name }} - {{ stock.buy_price }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>還沒有任何股票，快去新增！</p>
    {% endif %}
</body>
</html>
