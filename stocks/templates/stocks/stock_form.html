{% extends 'base.html' %}

{% block title%} 股票表單 {% endblock%}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">新增股票</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2">
                <button type="submit">儲存</button>
                <a href="{% url 'stock_list' %}" class="btn btn-primary">取消</a>
            </div>
        </form>

    </div>
</div>


{% endblock %}
