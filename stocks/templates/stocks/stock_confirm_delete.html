{% extends 'base.html' %}

{% block title %}確認刪除{% endblock%}

{% block content %}
<div class="row justify-content-center">
    <div class="col">

        <h1 class="mb-4">刪除股票</h1>
        <div class="alert alert-danger">
            <p>確定要刪除<strong>{{ stock.symbol }} - {{ stock.name }} 嗎？</strong></p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">確認刪除</button>
                <a href="{% url 'stock_list' %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock%}
