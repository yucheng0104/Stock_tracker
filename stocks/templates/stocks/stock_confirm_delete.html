{% extends 'base.html' %}

{% block title %}確認刪除{% endblock%}

{% block content %}
    <h1>刪除股票</h1>
    <p>你確定要刪除 {{ stock.symbol }} - {{ stock.name }} 嗎？</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">確認刪除</button>
        <a href="{% url 'stock_list' %}">取消</a>
    </form>
{% endblock%}
